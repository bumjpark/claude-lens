version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: claudelens-postgres
    environment:
      POSTGRES_DB: claudelens
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: claudelens-mongo
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      # 호스트에 이미 27017을 쓰는 별도의 로컬 MongoDB(brew 서비스)가 있어서 27018로 매핑
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  ai:
    build: ../ai
    container_name: claudelens-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mongo_data:
